<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Expense Tracker</h1>
<section id="opening_balance_section">
    <p>Opening Balance</p>
    <p id="opening_balance"></p>
    <input type="button" value="Edit" onclick="readBalanceFromUser()" />
</section>
<section id="current_balance_section">
    <p>Current Balance</p>
    <p id="current_balance"></p>
</section>
<section id="total_income_section">
    <p>Total Income</p>
    <p id="total_income"></p>
</section>
<section id="total_expense_section">
    <p>Total Expense</p>
    <p id="total_expense"></p>
</section>
<section>
    <input type="button" value="Add Expense" onclick="showExpenseForm()" />
    <form style="display: none;" id="expense_form" onsubmit="submitExpenseForm(event)">
        <label for="expense_amount">Amount</label>
        <input type="number" name="amount" id="expense_amount" />
        <label for="expense_date">Date</label>
        <input type="date" name="date" id="expense_date" />
        <label for="expense_description">Description</label>
        <input type="text" name="description" id="expense_description" />
        <label for="expense_category">Category</label>
        <select id="expense_category" name="expense_category">
            <option value="food">Food</option>
            <option value="transport">Transport</option>
            <option value="shopping">Shopping</option>
        </select>
        <input type="submit" value="Add Expense" />
    </form>
    <input type="button" value="Add Income" onclick="showIncomeForm()" />
    <form style="display: none;" id="income_form" onsubmit="submitIncomeForm(event)">
        <label for="income_amount">Amount</label>
        <input type="number" name="amount" id="income_amount" />
        <label for="income_date">Date</label>
        <input type="date" name="date" id="income_date" />
        <label for="income_description">Description</label>
        <input type="text" name="income_description" id="income_description" />
        <label for="income_category">Category</label>
        <select id="income_category">
            <option value="savings">Savings</option>
            <option value="gift">Gift</option>
            <option value="salary">Salary</option>
        </select>
        <input type="submit" value="Add Income" />
    </form>
</section>
<section class="transaction_list">
    <section id="expense_list_section">
        <h2>Expense</h2>
        <select id="expense_filter" onchange="filterExpenses()">
            <option value="all">All</option>
            <option value="food">Food</option>
            <option value="transport">Transport</option>
            <option value="shopping">Shopping</option>
        </select>
        <ul id="expense_list">

        </ul>
    </section>
    <section id="income_list_section">
        <h2>Income</h2>
                <select id="income_filter" onchange="filterIncome()">
            <option value="all">All</option>
            <option value="savings">Savings</option>
            <option value="gift">Gift</option>
            <option value="salary">Salary</option>
        </select>
        <ul id="income_list">

        </ul>
    </section>
</section>

<script>
    let transactions = getTransactions();
    let balance = calculateBalance();
    function setTransactions(transactions) {
        localStorage.setItem("transactions", JSON.stringify(transactions));
    }
    function getTransactions() {
        const transactions = localStorage.getItem("transactions");
        if (transactions === null) {
            return [];
        }
        return JSON.parse(transactions);
    }

    function listExpenses() {
        const expense_list = document.getElementById("expense_list");
        //we have to clear  the list for rebuilding otherwise elenments get appended to itself..this prevents repition
        expense_list.innerHTML = ""

        transactions.forEach((transaction) => {
            if (transaction.type === "expense") {
                const expense_list_item = document.createElement("li");
                expense_list_item.textContent = `${transaction.description} - ${transaction.amount}`
                expense_list.appendChild(expense_list_item);
            }
        });

    }
    function filterExpenses() {
        const expenseFilterValue = document.getElementById("expense_filter").value;
        const expense_list = document.getElementById("expense_list");
        expense_list.innerHTML = "";

        transactions.forEach((transaction) => {
            if (transaction.type === "expense") {
                if (expenseFilterValue === "all" || transaction.category === expenseFilterValue) {
                    const expense_list_item = document.createElement("li");
                    expense_list_item.textContent = `${transaction.description} - ${transaction.amount}`;
                    expense_list.appendChild(expense_list_item);
                }
            }
        });
    }
        function filterIncome() {
        const incomeFilterValue = document.getElementById("income_filter").value;
        const income_list = document.getElementById("income_list");
        income_list.innerHTML = "";

        transactions.forEach((transaction) => {
            if (transaction.type === "income") {
                if (incomeFilterValue === "all" || transaction.category === incomeFilterValue) {
                    const income_list_item = document.createElement("li");
                    income_list_item.textContent = `${transaction.description} - ${transaction.amount}`;
                    income_list.appendChild(income_list_item);
                }
            }
        });
    }
    function listIncome() {
        const income_list = document.getElementById("income_list");
        //we have to clear  the list for rebuilding otherwise elenments get appended to itself..this prevents repition
        income_list.innerHTML = ""

        transactions.forEach((transaction) => {
            if (transaction.type === "income") {
                const income_list_item = document.createElement("li");
                income_list_item.textContent = `${transaction.description} - ${transaction.amount}`
                income_list.appendChild(income_list_item);
            }
        });

    }

    function calculateTotalIncome() {
        if (transactions == []) {
            return 0;
        }
        let income = 0;
        transactions.forEach((transaction) => {
            if (transaction.type === "income") {
                income += transaction.amount;
            }
        })
        return income;
    }

    function calculateTotalExpense() {
        if (transactions == null) {
            return 0;
        }
        let expense = 0;
        transactions.forEach((transaction) => {
            if (transaction.type === "expense") {
                expense += transaction.amount;
            }
        });
        return expense;
    }
    function calculateBalance () {
        const balance = readOpeningBalance() +calculateTotalIncome() - calculateTotalExpense();
        updateBalance(balance);
        return balance;
    }
    function updateBalance(balance) {
        document.getElementById("current_balance").textContent = balance
    }
    function displayTotalIncome() {
        document.getElementById("total_income").innerHTML = calculateTotalIncome();
    }
    function displayTotalExpense() {
        document.getElementById("total_expense").innerHTML = calculateTotalExpense();
    }
    //function to read opening balance from local storage
    function readOpeningBalance() {
        let opening_balance = parseFloat(localStorage.getItem("opening_balance"));
        if(opening_balance == NaN) {
            return 0;
        }
        return opening_balance;
    }
    //function to set opening balance in local storage
    function setOpeningBalance(balance) {
        let opening_balance = localStorage.setItem("opening_balance", balance);
    }
    //read balance from the user and set it in local storage
    function readBalanceFromUser() {
        let inputBalance = parseFloat(prompt("Enter Opening Balance"));
        setOpeningBalance(inputBalance);
        setOpeningBalanceHTML();
        calculateBalance();
    }
    //we are settng the balance as the html value
    function setOpeningBalanceHTML() {
        const opening_balance = readOpeningBalance();
        if (!Number.isNaN(opening_balance)) {
            document.getElementById("opening_balance").innerHTML = readOpeningBalance();
        }
        else {
            document.getElementById("opening_balance").innerHTML = "Balance is not defined.";
        }
    }
    function showExpenseForm() {
        document.getElementById("expense_form").style.display = "block";
    }
    function showIncomeForm() {
        document.getElementById("income_form").style.display = "block";
    }
    function submitExpenseForm(e) {
        e.preventDefault();
        const type = "expense";
        const amount = parseFloat(document.getElementById("expense_amount").value);
        const date = document.getElementById("expense_date").value;
        const description = document.getElementById("expense_description").value;
        const category = document.getElementById("expense_category").value;

        const transaction = {
            type, amount, date, description, category
        }

        transactions.push(transaction);
        setTransactions(transactions);
        listExpenses();
        displayTotalExpense();
        balance = calculateBalance();
        document.getElementById("expense_form").reset();
    }
    function submitIncomeForm(e) {
        e.preventDefault();
        const type = "income";
        const amount = parseFloat(document.getElementById("income_amount").value);
        const date = document.getElementById("income_date").value;
        const description = document.getElementById("income_description").value;
        const category = document.getElementById("income_category").value;

        const transaction = {
            type, amount, date, description, category
        }

        transactions.push(transaction);
        setTransactions(transactions);
        listIncome();
        displayTotalIncome();
        balance = calculateBalance();
        document.getElementById("income_form").reset();

    }

    setOpeningBalanceHTML();
    listExpenses();
    listIncome();
    displayTotalIncome();
    displayTotalExpense();
</script>
</body>
</html>
